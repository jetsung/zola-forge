base_url = "https://forge-demo.idev.top"

title = "forge 主题示例站"

description = "forge 主题的完整示例：作品展示 + 博客"

default_language = "zh"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "forge"

output_dir = "public"

# The default author for pages
author = "Jetsung Chan"

taxonomies = [
    { name = "tags", paginate_by = 10 },
    { name = "categories", paginate_by = 10 },
]

[markdown]
# GFM 扩展（GitHub alerts 提示块与裸 URL 自动链接）
github_alerts = true
# 正文外链在新标签页打开
external_links_target_blank = true

[markdown.highlighting]
# 代码块语法高亮（Syntect，浅色主题）
theme = "github-light"

[extra]
# 首页模式：projects（作品展示）/ blog（个人资料 + 博客列表）/ mixed（作品 + 博客混合）
home_type = "blog"
# 博客/mixed 模式下主页展示的最近文章数量
home_blog_count = 5
# 头部品牌行文字（设为 "" 可隐藏品牌行）
site_brand = "Forge Demo"
# 头部副标题文字
site_subtitle = "forge 主题示例站：收录示例项目的开发、孵化与归档。"
# 页脚文案（支持 HTML：可自定义版权文本、备案链接、统计代码等）；留空则显示默认版权与主题信息
footer_text = ""
# 主页精选项目数量（最近更新的毕业项目，≥ 4 时以跑马灯循环展示，否则静态网格）
featured_count = 6
# 主页默认展示的状态板块（对应 content/projects/ 下的子 section 目录名）
home_default_status = "graduate"

[extra.pwa]
# 是否启用 PWA（Service Worker 离线缓存 + 注册脚本）
enabled = false

[extra.favicon]
# 站点 static/ 目录下的图标与 PWA 资源；留空则不输出对应 link
ico = "favicon.ico"
apple = ""
manifest = ""
# PWA 主题色（浏览器 UI / 安装横幅）
theme_color = "#0e7490"

[extra.nav]
# 头部导航菜单（path 为站内相对路径）
links = [
    { name = "首页", path = "/" },
    { name = "作品", path = "/projects/" },
    { name = "博客", path = "/blog/" },
    { name = "分类", path = "/categories/" },
    { name = "标签", path = "/tags/" },
    { name = "关于", path = "/about/" },
]

[extra.profile]
# 是否启用个人介绍区（false 时主页与板块页整体省略该区块）
enable = true
# 头像字母（圆角方块中的单字）
avatar = "F"
name = "Forge Demo"
role = "forge 主题演示账号"
bio = "forge 主题的完整示例站：作品按状态分组展示，博客支持 asciinema 终端录制嵌入。"
skills = ["Zola", "Rust", "Markdown"]
# 开源年数 = 当前年份 - start_year
start_year = 2020
# 联系链接列表：name 为显示文字，url 为目标地址
contacts = [
    { name = "GitHub", url = "https://github.com/jetsung" },
    { name = "Email", url = "mailto:i@jetsung.com" },
]
