    <rect x="52" y="64" width="84" height="30" rx="8"/>
    <rect x="52" y="112" width="64" height="30" rx="8"/>
  </g>
  <rect x="168" y="162" width="36" height="30" rx="8" fill="#67e8f9"/>
</svg>
