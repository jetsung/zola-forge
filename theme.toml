name = "forge"
description = "个人开发者主题：作品展示（个人介绍、按状态分类的卡片看板、项目详情）+ 博客（文章列表、文章详情、标签/分类），零运行时 JavaScript。"
license = "Apache-2.0"
homepage = "https://github.com/jetsung/zola-forge"
min_version = "0.19.0"
demo = ""

tags = ["portfolio", "blog", "projects", "personal", "chinese", "minimal"]

[extra]
# 首页模式：projects（作品展示）/ blog（个人资料 + 博客列表）/ mixed（作品 + 博客混合）
home_type = "projects"
# 博客/mixed 模式下主页展示的最近文章数量
home_blog_count = 5
# 头部品牌行文字（设为 "" 可隐藏品牌行）
site_brand = "Jetsung.com"
# 头部副标题文字
site_subtitle = "收录我个人正在开发、已停止与已完成的全部项目。"
# 页脚文案（支持 HTML：可自定义版权文本、备案链接、统计代码等）；留空则显示默认版权与主题信息
footer_text = ""
# 主页精选项目数量（最近更新的毕业项目，≥ 4 时以跑马灯循环展示，否则静态网格）
featured_count = 6
# 主页默认展示的状态板块（对应 content/projects/ 下的子 section 目录名）
home_default_status = "graduate"

[extra.pwa]
# 是否启用 PWA（Service Worker 离线缓存 + 注册脚本）
enabled = true

[extra.favicon]
# 站点 static/ 目录下的图标与 PWA 资源；留空则不输出对应 link
ico = "favicon.ico"
apple = "apple-touch-icon.png"
manifest = "manifest.webmanifest"
# PWA 主题色（浏览器 UI / 安装横幅）
theme_color = "#0e7490"

[extra.nav]
# 头部导航菜单（path 为站内相对路径）
links = [
    { name = "首页", path = "/" },
    { name = "作品", path = "/projects/" },
    { name = "博客", path = "/blog/" },
    { name = "分类", path = "/categories/" },
    { name = "标签", path = "/tags/" },
    { name = "关于", path = "/about/" },
]

[extra.profile]
# 是否启用个人介绍区（false 时主页与板块页整体省略该区块）
enable = true
# 头像字母（圆角方块中的单字）
avatar = "J"
name = "Jetsung"
role = "独立开发者 / 开源爱好者"
bio = "一名喜欢造轮子的独立开发者。相信小而美的工具能解决真实的问题。"
skills = ["Rust", "Go", "Python", "TypeScript", "Shell", "SQLite", "DevOps"]
# 开源年数 = 当前年份 - start_year
start_year = 2016
# 联系链接列表：name 为显示文字，url 为目标地址
contacts = [
    { name = "GitHub", url = "https://github.com/me" },
    { name = "Email", url = "mailto:me@example.com" },
    { name = "博客", url = "https://blog.example.com" },
]

[author]
name = "Jetsung Chan"
homepage = "https://github.com/jetsung"
